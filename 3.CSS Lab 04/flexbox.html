<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        /* Parent Container */
        .container {
            border: 2px solid black;
            background-color: aquamarine;
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
        }
        /* Child */
        .container div {
            border: 2px solid red;
            width: 100px;
            height: 100px;
            text-align: center;
            align-content: center;


        }
    </style>
</head>
<body>
    <div class="container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>
</body>
</html>
